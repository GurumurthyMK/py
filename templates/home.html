{% extends "layout.html" %}

{% block content %}

<section class="home-header">
  <h1 class="home-title">Latest Posts</h1>
  <p class="home-subtitle">Short notes from my FastAPI learning project.</p>
</section>

<section class="posts">
    {% for post in posts %}
    <article class="post-card">
      <h2 class="post-title" href="{{url_for('post_page', post_id = post.id)}}">{{ post.title }}</h2>
      <p class="post-excerpt">{{ post.content }}</p>
      <div class="post-meta">
        <span class="post-id">#{{ post.id }}</span>
        <a class="post-link" href="/posts/{{ post.id }}">Read more →</a>
      </div>
    </article>
    {% endfor %}
</section>

{% endblock content %}
