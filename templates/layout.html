<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}FastAPI Blog · {{ title }}{% else %}FastAPI Blog{% endif %}</title>
    <meta name="description" content="A simple blog built while learning FastAPI.">
    <!-- Single shared stylesheet in static dir. -->
    <link rel="stylesheet" href="{{ url_for('static', path = 'css/style.css' ) }}">
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="{{ url_for('home') }}"> FastAPI Blog</a>
            <ul class="nav-links">
                <li><a href="{{ url_for ('home') }}">Home</a></li>
                <li><a href="{{ url_for('posts') }}">Posts</a></li>
                <li><a class="btn-post" href="/api/posts">API</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-shell">
        {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>Built with FastAPI + Jinja while learning.</span>
            <a href="/api/posts">Explore the JSON API →</a>
        </div>
    </footer>
</body>
</html>
